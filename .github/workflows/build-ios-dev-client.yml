name: Build iOS Dev Client (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the SideStore release (GITHUB_TOKEN only, no personal token)

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read build metadata
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          BUILD="${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IPA_FILENAME="LOCKED-IN-2_${VERSION}_Build${BUILD}_${SHORT_SHA}.ipa"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "IPA_FILENAME=$IPA_FILENAME" >> "$GITHUB_ENV"
          echo "Version $VERSION, build $BUILD, file $IPA_FILENAME"

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: |
          pod --version
          pod install

      - name: Detect workspace and scheme
        id: detect
        working-directory: app/ios
        run: |
          set -euo pipefail

          WORKSPACE="$(ls -d *.xcworkspace | head -n 1)"
          if [ -z "$WORKSPACE" ]; then
            echo "::error::No .xcworkspace found in app/ios"
            exit 1
          fi

          xcodebuild -list -workspace "$WORKSPACE" -json > /tmp/workspace-list.json
          xcodebuild -list -project Pods/Pods.xcodeproj -json > /tmp/pods-list.json

          echo "All workspace schemes:"
          jq -r '.workspace.schemes[]' /tmp/workspace-list.json

          # The workspace lists app schemes plus every CocoaPods scheme.
          # App schemes = workspace schemes that are not defined in Pods.xcodeproj.
          SCHEME="$(jq -r --slurpfile pods /tmp/pods-list.json \
            '.workspace.schemes - ($pods[0].project.schemes // []) | .[0] // empty' \
            /tmp/workspace-list.json)"

          if [ -z "$SCHEME" ]; then
            echo "::error::No app scheme found in workspace $WORKSPACE"
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Selected scheme: $SCHEME"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned Debug app (iphoneos)
        working-directory: app/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: app/ios
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in build/Build/Products/Debug-iphoneos"
            exit 1
          fi
          echo "App bundle: $APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_FILENAME" Payload

          ls -lh ./*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-client-unsigned-ipa
          path: app/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare SideStore feed
        working-directory: .
        run: |
          set -euo pipefail
          TAG="build-${BUILD}"
          RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases"
          IPA_SIZE="$(stat -f%z "app/ios/${IPA_FILENAME}")"
          mkdir -p dist
          cp "app/ios/${IPA_FILENAME}" dist/
          cp app/assets/icon.png dist/icon.png
          python3 scripts/generate_sidestore_source.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --latest-base-url "${RELEASE_BASE}/latest/download" \
            --download-url "${RELEASE_BASE}/download/${TAG}/${IPA_FILENAME}" \
            --ipa-size "$IPA_SIZE" \
            --release-date "$(date -u +%Y-%m-%d)" \
            --release-notes "Testbuild (Dev Client, unsigned). Build ${BUILD}, Commit ${SHORT_SHA}." \
            --output dist/source.json
          python3 -m json.tool dist/source.json > /dev/null
          test -s "dist/${IPA_FILENAME}"
          test -s dist/icon.png
          cat dist/source.json

      - name: Publish GitHub release (SideStore source)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${BUILD}"
          gh release create "$TAG" \
            "dist/${IPA_FILENAME}" dist/source.json dist/icon.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LOCKED IN 2 – Build ${BUILD}" \
            --notes "Unsigned dev client build ${BUILD} (${SHORT_SHA}). Install via SideStore." \
            --latest
